name: Verify Dominic photo initiatives

on:
  push:
    branches:
      - dominic-spontaneous-photo-initiative-controls-20261009
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check photo scene interpretations without image charges
        run: bun test tests/photo-scene-intent.test.ts
      - name: Build
        run: bun run build
