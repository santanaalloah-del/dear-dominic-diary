name: Verify Dominic photo initiatives

on:
  push:
    branches:
      - dominic-spontaneous-photo-initiative-controls-20261009
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check photo scene interpretations without image charges
        run: bun test tests/photo-scene-intent.test.ts tests/photo-variation-plan.test.ts tests/photo-tattoo-boundaries.test.ts
      - name: Check independent Date, daily outfits and wardrobe selection without API costs
        run: bun test tests/dominic-date-invitations.test.ts tests/dominic-daily-outfits.test.ts tests/wardrobe-selection.test.ts
      - name: Check empty Supabase budget RPC responses without AI calls
        run: bun test tests/budget-rpc-response.test.ts
      - name: Check sticky chat dates without AI/image usage
        run: bun test tests/chat-day-heading.test.ts
      - name: Check single date chip follows first visible chat message
        run: bun test tests/chat-visible-day.test.ts
      - name: Wardrobe contrast regression checks (no external services)
        run: bun test tests/wardrobe-contrast.test.ts
      - name: Verify Dominic invitation acceptance safeguards
        run: bun test tests/date-invitation-consent.test.ts
      - name: Build
        run: bun run build
